<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- As fontes que vão junto com o projeto (Poppins): esta pasta. -->
    <dir prefix="relative">.</dir>

    <!-- As do sistema, para o que o Poppins não tem: no Linux a configuração
         padrão (DejaVu etc.); no Windows a pasta de fontes. Se não existir,
         o fontconfig ignora. -->
    <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
    <dir>WINDOWSFONTDIR</dir>
    <dir>WINDOWSUSERFONTDIR</dir>

    <cachedir prefix="xdg">helena-fontconfig</cachedir>
</fontconfig>
