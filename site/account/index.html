<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Helena</title>
<meta name="description" content="Entre com a sua conta da VSync para resgatar o daily e coletar gemas da Helena.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0613">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/account.css">
<script defer src="../js/config.js"></script>
<script defer src="../js/util.js"></script>
<script defer src="../js/account.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../" aria-label="Helena, voltar ao site">
      <img src="../assets/img/helena-avatar.webp" alt="" width="36" height="36">
      <b>Helena</b><small>ヘレナ</small>
    </a>
    <div class="actions acc-actions">
      <a class="btn" href="../">Voltar ao site</a>
    </div>
  </div>
</header>

<main class="wrap acc-page">

  <!-- Desafio anti-robô: caixa fixa (o iframe do Turnstile não pode ser movido). -->
  <section class="acc-box acc-captcha" id="acc-captcha-box" hidden>
    <p class="acc-small">Antes de coletar, confirme que você não é um robô:</p>
    <div id="acc-captcha"></div>
  </section>

  <div id="account">
    <noscript>
      <section class="acc-box acc-notice">
        <h2>Precisa de JavaScript</h2>
        <p>O painel da conta só funciona com JavaScript ligado no navegador.</p>
      </section>
    </noscript>
  </div>

  <p class="acc-privacy">Para a sua segurança, cada entrada, coleta e recusa é registrada com data, IP e navegador. Automação para coletar não é permitida.</p>

</main>

</body>
</html>
