<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- O GitHub Pages serve esta página em qualquer endereço errado, em qualquer
     profundidade (/x, /wiki/y/z...). Por isso os caminhos partem sempre da raiz
     do site. Se o endereço do site mudar, mude aqui e em config/site.mjs: um teste confere. -->
<base href="https://helenacry.github.io/helena-bot/">
<title>Página não encontrada | Helena</title>
<meta name="description" content="Esta página não existe. Volte ao início do site da Helena ou procure na wiki.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0613">
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/legal.css">
</head>
<body>

<header class="top" id="top-bar">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Helena, voltar ao site">
      <img src="assets/img/helena-avatar.webp" alt="" width="36" height="36">
      <b>Helena</b><small>ヘレナ</small>
    </a>
    <div class="actions">
      <a class="btn" href="./">Voltar ao site</a>
    </div>
  </div>
</header>

<main class="wrap legal">

  <header class="legal-head">
    <span class="eyebrow">Erro 404</span>
    <h1>Essa página não existe</h1>
    <p class="lede">O endereço pode ter mudado ou ter sido digitado errado. Daqui dá para voltar ao início ou procurar na wiki, que explica cada parte do jogo.</p>
    <div class="cta-row">
      <a class="btn primary big" href="./">Ir para o início</a>
      <a class="btn big" href="wiki/">Abrir a wiki</a>
    </div>
  </header>

</main>

</body>
</html>
