name: Publicar site

# Publica a pasta site/ no GitHub Pages sempre que algo nela muda na main.
# Também dá para rodar à mão, na aba Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Só o que o navegador precisa. Os geradores do site moram em scripts/site/
      # (rodam no computador de quem mantém o bot); o filtro de .mjs é só uma trava,
      # para um script nunca ir parar na página se alguém o puser em site/.
      - name: Montar a pasta do site
        run: |
          mkdir _site
          rsync -a --exclude='*.mjs' site/ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
