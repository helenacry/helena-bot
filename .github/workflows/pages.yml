name: Publicar site

# O site (Astro, na pasta site/) é conferido a cada push na main e na testes: tipos, build, verificação
# (contraste, links, peso, metadados) e os testes de navegador (acessibilidade com axe, rolagem lateral,
# pedidos a terceiros e os fluxos principais). Os testes do bot (npm test) rodam num job à parte e não
# seguram o site.
#
# O site de verdade é servido pelo próprio bot, no Discloud (config/site.mjs): o zip leva o site montado
# (npm run site:build e depois npm run discloud:zip). O GitHub Pages ficou só com um redirecionamento do
# endereço antigo, publicado a partir da main depois que tudo passa. Também dá para rodar à mão, na aba Actions.
on:
  push:
    branches: [main, testes]
    paths:
      - "site/**"
      - "wiki/**"
      - "scripts/site/**"
      - "config/site.mjs"
      - "config/web.mjs"
      - "assets/helena_pfp.png"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma execução por branch: um push novo cancela a anterior da mesma branch (a testes nunca
# cancela uma publicação da main)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar as dependências do site
        run: npm ci --prefix site

      - name: Conferir os tipos
        run: npm --prefix site run check

      - name: Montar o site
        run: npm --prefix site run build

      - name: Verificar o build (contraste, links, peso e metadados)
        run: npm --prefix site run verify

      - name: Instalar o navegador dos testes
        run: npx --prefix site playwright install --with-deps chromium

      - name: Testes de navegador (acessibilidade e fluxos)
        working-directory: site
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test

      # O site de verdade é servido pelo próprio bot, no Discloud (o zip leva o site montado). O Pages
      # só guarda um redirecionamento, para os links antigos (helenacry.github.io/helena-bot/...)
      # levarem ao endereço novo.
      - name: Montar o redirecionamento do endereço antigo
        run: node site/scripts/build-redirect.mjs site/redirect

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/redirect

  deploy:
    needs: build
    # a testes só confere; quem publica é a main (ou uma execução manual na main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # duas publicações nunca ao mesmo tempo, e nenhuma é cancelada no meio
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Os testes do bot e da lógica que o site compartilha com ele (dados, política de privacidade
  # contra o banco, wiki). Falhar aqui avisa, mas não impede a publicação do site.
  bot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
