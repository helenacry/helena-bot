name: Publicar site

# O site (Astro, na pasta site/) é conferido a cada push na main e na testes, e publicado no
# GitHub Pages só a partir da main. Também dá para rodar à mão, na aba Actions.
#
# A publicação só acontece se passar em tudo: tipos, build, verificação (contraste, links, peso,
# metadados) e os testes de navegador (acessibilidade com axe, rolagem lateral, pedidos a
# terceiros e os fluxos principais). Os testes do bot (npm test) rodam num job à parte e não
# seguram o site.
on:
  push:
    branches: [main, testes]
    paths:
      - "site/**"
      - "wiki/**"
      - "scripts/site/**"
      - "config/site.mjs"
      - "config/web.mjs"
      - "assets/helena_pfp.png"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma execução por branch: um push novo cancela a anterior da mesma branch (a testes nunca
# cancela uma publicação da main)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar as dependências do site
        run: npm ci --prefix site

      - name: Conferir os tipos
        run: npm --prefix site run check

      - name: Montar o site
        run: npm --prefix site run build

      - name: Verificar o build (contraste, links, peso e metadados)
        run: npm --prefix site run verify

      - name: Instalar o navegador dos testes
        run: npx --prefix site playwright install --with-deps chromium

      - name: Testes de navegador (acessibilidade e fluxos)
        working-directory: site
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    # a testes só confere; quem publica é a main (ou uma execução manual na main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # duas publicações nunca ao mesmo tempo, e nenhuma é cancelada no meio
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Os testes do bot e da lógica que o site compartilha com ele (dados, política de privacidade
  # contra o banco, wiki). Falhar aqui avisa, mas não impede a publicação do site.
  bot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
